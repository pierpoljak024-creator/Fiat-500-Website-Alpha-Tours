# Netlify deployment configuration.
#
# The site is a static Next.js export (`output: "export"` in next.config.ts), so
# Netlify only serves the files in `out/` — no Next.js runtime is involved. The
# one piece of server logic, the enquiry form endpoint, lives in
# netlify/functions/inquiry.ts and is exposed at /api/inquiry by the rewrite
# below.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The browser keeps posting to /api/inquiry; a 200 rewrite forwards the request
# (method and body included) to the function.
[[redirects]]
  from = "/api/inquiry"
  to = "/.netlify/functions/inquiry"
  status = 200
  force = true

# Long-lived caching for the self-hosted media in /public
# (carried over from the old vercel.json).
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Hashed build assets never change, so they can be cached forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The generated icon and share card are extensionless files (their names come
# from Next.js), so the MIME type has to be set explicitly — without it Netlify
# serves them as text/plain and browsers/social scrapers reject them.
[[headers]]
  for = "/icon"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
